# Random walk — frozen semantic specification
name: random_walk
semantics: snapshot_pointwise
description: >
  One displacement is generated per agent and step, keyed by stable agent
  identity. Boundary behaviour is clipping to [0, world_size].
world_size: 100.0
speed: 1.0
boundary: clip
position_dtype: float64
random:
  backend: counter_rng
  displace_x_event: EVT_DISPLACE_X
  displace_y_event: EVT_DISPLACE_Y
  key: [global_seed, step, event, agent_id, 0, 0]
  displacement: uniform[-speed, +speed]
acceptance:
  abs_tol: 1.0e-12
  rel_tol: 0.0
  discrete_state_mismatches: 0
