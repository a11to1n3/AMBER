[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ambr"
version = "0.4.0"
description = "Agent-based Modeling with Blazingly Efficient Records"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "a11to1n3", email = "citation.needed@example.com" }
]
keywords = [
    "agent-based modeling",
    "simulation",
    "polars",
    "multi-agent systems",
    "scientific computing"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "polars>=0.20.0",
    "numpy>=1.20.0",
    "matplotlib>=3.3.0",
    "seaborn>=0.11.0",
    "networkx>=2.5",
    "scikit-optimize>=0.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "coverage>=7.0.0",
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "myst-parser>=0.18.0",
    "nbsphinx>=0.8.0",
    "nbconvert>=6.0.0",
    "jupyter>=1.0.0",
    "build>=1.2.0",
    "twine>=5.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0"
]
advanced = [
    # SMAC 2.4 imports sklearn.tree._tree.DTYPE, removed in scikit-learn 1.9
    # (automl/SMAC3#1314). Keep sklearn in the range SMAC actually runs on.
    "smac>=2.0.0,<3",
    "ConfigSpace>=0.7.1",
    "scikit-learn>=1.6.1,<1.9",
]
docs = [
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "myst-parser>=0.18.0",
    "nbsphinx>=0.8.0",
    "nbconvert>=6.0.0",
    "jupyter>=1.0.0"
]
examples = [
    "plotly>=5.0.0",
    "ipywidgets>=8.0.0",
    "notebook>=6.0.0"
]

[project.urls]
Homepage = "https://github.com/a11to1n3/AMBER"
Repository = "https://github.com/a11to1n3/AMBER"
Issues = "https://github.com/a11to1n3/AMBER/issues"
Changelog = "https://github.com/a11to1n3/AMBER/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
# The CuPy GPU backend and the batched-ensemble runner require CUDA hardware,
# which CI runners do not have. They fall back to NumPy at import time but their
# device kernels can only be exercised on a GPU, so exclude them from the
# coverage gate rather than let an untestable module sink the project total.
omit = [
    "src/ambr/gpu.py",
    "src/ambr/gpu_ensemble.py",
]
