# GPU claim verification — requires a real CUDA runner.
#
# Missing CUDA is NOT VERIFIED (exit 1), never soft-green. Configure
# repository variable GPU_RUNNER to a single self-hosted runner label
# (e.g. cuda) on a machine with NVIDIA + CuPy.
# Locally:
#   python scripts/run_gpu_claims.py --quick

name: GPU claims (nightly / manual)

on:
  schedule:
    # 06:00 UTC daily — hard-fails as NOT VERIFIED without CUDA
    - cron: "0 6 * * *"
  workflow_dispatch:
  # No path-push trigger: without a GPU runner every merge would fail red.
  # Release tags still run the CUDA gate in release.yml.

permissions:
  contents: read

jobs:
  gpu-claims:
    name: GPU claim smoke
    # Prefer a self-hosted CUDA runner. Falling back to ubuntu-latest without
    # a GPU fails as NOT VERIFIED (never soft-skip green).
    runs-on: ${{ vars.GPU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Require real CUDA (NOT VERIFIED if missing)
        id: cuda
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gpu-evidence
          {
            echo "runner_name=${RUNNER_NAME:-unknown}"
            echo "runner_os=${RUNNER_OS:-unknown}"
            echo "gpu_runner_var=${GPU_RUNNER_VAR:-<unset>}"
            echo "ambr_commit=${GITHUB_SHA}"
            date -u +"timestamp_utc=%Y-%m-%dT%H:%M:%SZ"
          } | tee gpu-evidence/runner.txt

          if ! command -v nvidia-smi >/dev/null 2>&1; then
            echo "NOT_VERIFIED" | tee gpu-evidence/status.txt
            echo "::error::GPU nightly NOT VERIFIED: nvidia-smi not found. Set repository variable GPU_RUNNER to a self-hosted NVIDIA runner (never soft-green)."
            exit 1
          fi
          if ! nvidia-smi -L >/dev/null 2>&1; then
            echo "NOT_VERIFIED" | tee gpu-evidence/status.txt
            echo "::error::GPU nightly NOT VERIFIED: nvidia-smi -L failed."
            exit 1
          fi
          nvidia-smi -L | tee gpu-evidence/nvidia-smi-L.txt
          nvidia-smi | tee gpu-evidence/nvidia-smi.txt
          echo "VERIFIED_HARDWARE" | tee gpu-evidence/status.txt
        env:
          GPU_RUNNER_VAR: ${{ vars.GPU_RUNNER }}

      - name: Install package + CuPy
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev,perf]"
          if ! python -m pip install "cupy-cuda12x" \
            && ! python -m pip install "cupy-cuda11x" \
            && ! python -m pip install "cupy"; then
            echo "NOT_VERIFIED" | tee gpu-evidence/status.txt
            echo "::error::GPU nightly NOT VERIFIED: could not install CuPy."
            exit 1
          fi
          python -c "import ambr as am; assert am.GPU_AVAILABLE, 'CuPy installed but GPU_AVAILABLE is False'"

      - name: Collect hardware evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee gpu-evidence/environment.json
          import json, os, platform, subprocess, sys
          def sh(cmd):
              try:
                  return subprocess.check_output(cmd, text=True, stderr=subprocess.STDOUT)
              except Exception as exc:
                  return f"<failed: {exc}>"
          nvidia = sh(["nvidia-smi", "--query-gpu=name,driver_version,memory.total", "--format=csv,noheader"])
          try:
              import cupy
              cupy_ver = getattr(cupy, "__version__", str(cupy))
          except Exception as exc:
              cupy_ver = f"<import failed: {exc}>"
          try:
              import ambr
              ambr_ver = getattr(ambr, "__version__", "?")
              gpu_avail = bool(getattr(ambr, "GPU_AVAILABLE", False))
          except Exception as exc:
              ambr_ver = f"<import failed: {exc}>"
              gpu_avail = False
          print(json.dumps({
              "gpu_model": nvidia.strip(),
              "cupy": cupy_ver,
              "python": sys.version,
              "platform": platform.platform(),
              "ambr_version": ambr_ver,
              "ambr_commit": os.environ.get("GITHUB_SHA", ""),
              "gpu_available": gpu_avail,
          }, indent=2))
          PY

      - name: Run GPU claim script + GPU pytest
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "=== run_gpu_claims.py --quick ==="
            python scripts/run_gpu_claims.py --quick
            echo "=== pytest GPU modules ==="
            python -m pytest tests/test_gpu_backend.py tests/test_gpu_ensemble.py \
              -o addopts='-ra --strict-markers' --tb=short -q
          } 2>&1 | tee gpu-evidence/test-output.txt

      - name: Upload GPU hardware evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gpu-nightly-evidence
          path: gpu-evidence/**
          if-no-files-found: warn
          retention-days: 30
