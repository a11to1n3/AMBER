name: Release

# Builds sdist/wheel on tag push (v*), creates a GitHub Release, and publishes
# to PyPI via Trusted Publishing (OIDC — no long-lived API token in secrets).
#
# One-time setup on PyPI (project owner):
#   1. https://pypi.org/manage/project/ambr/settings/publishing/
#   2. Add a GitHub trusted publisher:
#        Owner:      a11to1n3
#        Repository: AMBER
#        Workflow:   release.yml
#        Environment: pypi
#   3. Create a GitHub Environment named "pypi" (optional protection rules).
#   4. Prefer revoking any chat-pasted API tokens after this is configured.
#
# Fallback (not recommended): store a project-scoped token as secret
# PYPI_API_TOKEN and the publish step will use it when OIDC is unavailable.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build release distributions
    runs-on: ubuntu-latest
    # Required for PyPI Trusted Publishing (OIDC).
    environment:
      name: pypi
      url: https://pypi.org/p/ambr
    permissions:
      contents: write
      id-token: write

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install build twine

    - name: Build distributions
      run: python -m build

    - name: Check distributions
      run: python -m twine check dist/*

    - name: Check package surface
      run: |
        python - <<'PY'
        import tarfile
        import zipfile
        from pathlib import Path

        dist = Path("dist")
        sdist = next(dist.glob("ambr-*.tar.gz"))
        wheel = next(dist.glob("ambr-*.whl"))
        forbidden_roots = {
            ".claude",
            ".github",
            "benchmarks",
            "docs",
            "examples",
            "paper",
            "tests",
        }
        forbidden_files = {"paper.zip"}

        def local_only_members(names):
            offenders = []
            for name in names:
                parts = Path(name).parts
                if len(parts) < 2:
                    continue
                root_member = parts[1]
                if root_member in forbidden_roots or root_member in forbidden_files:
                    offenders.append(name)
            return offenders

        with tarfile.open(sdist) as archive:
            sdist_offenders = local_only_members(archive.getnames())
        if sdist_offenders:
            raise SystemExit(
                "sdist contains local-only paths: "
                + ", ".join(sorted(sdist_offenders)[:20])
            )

        with zipfile.ZipFile(wheel) as archive:
            wheel_offenders = []
            for name in archive.namelist():
                parts = Path(name).parts
                if not parts:
                    continue
                if parts[0] in forbidden_roots or parts[0] in forbidden_files:
                    wheel_offenders.append(name)
        if wheel_offenders:
            raise SystemExit(
                "wheel contains local-only paths: "
                + ", ".join(sorted(wheel_offenders)[:20])
            )

        print(f"Checked package surface for {sdist.name} and {wheel.name}")
        PY

    - name: Upload distribution artifact
      uses: actions/upload-artifact@v7
      with:
        name: ambr-dist
        path: dist/*

    - name: Create GitHub release
      uses: softprops/action-gh-release@v3
      with:
        files: dist/*
        generate_release_notes: true

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        # Prefer OIDC (Trusted Publishing). If you still use a token instead,
        # set repository secret PYPI_API_TOKEN and uncomment password below —
        # do not commit tokens.
        # password: ${{ secrets.PYPI_API_TOKEN }}
        skip-existing: true
        verbose: true
